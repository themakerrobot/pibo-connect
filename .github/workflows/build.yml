name: build

# 소스가 도는지, 묶은 실행 파일이 실제로 뜨는지를 push 마다 본다.
# 배포는 release.yml 이 맡는다.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 의존성
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 문법
        run: python -m compileall -q pibo_connector run.py
      - name: 검증 (파싱·판별·PSK 유출·래퍼·서버 기동)
        run: python -m tests.smoke

  exe:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            built: dist/pibo-connect.exe
          - os: ubuntu-latest
            built: dist/pibo-connect
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - run: pyinstaller build/pibo-connect.spec --noconfirm
      - name: 묶은 실행 파일이 실제로 뜨는지
        run: python -m tests.exe_smoke ${{ matrix.built }} --timeout 150
      - uses: actions/upload-artifact@v4
        with:
          name: pibo-connect-${{ matrix.os }}
          path: ${{ matrix.built }}
          retention-days: 14
